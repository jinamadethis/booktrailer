:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#171A27; --muted:#585E72; --line:#D6D9E1; --slip:#FBFBF8;
  --blue:#2D47C8; --blue-soft:#E5E9FA; --hl:#FFE27A; --green:#23784A; --green-soft:#D8EEDF;
  --display:"Paperlogy","Pretendard",system-ui,sans-serif;
  --body:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131B; --surface:#1A1D28; --ink:#E8EAF1; --muted:#A3A9BB; --line:#30354A; --slip:#151824;
  --blue:#8EA1FF; --blue-soft:#232B52; --hl:#6B5600; --green:#6FD49A; --green-soft:#1F3A2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131B; --surface:#1A1D28; --ink:#E8EAF1; --muted:#A3A9BB; --line:#30354A; --slip:#151824;
  --blue:#8EA1FF; --blue-soft:#232B52; --hl:#6B5600; --green:#6FD49A; --green-soft:#1F3A2A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  min-height:100vh;display:flex;align-items:center;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 56px}
.wrap{width:100%;max-width:920px;margin:0 auto;display:grid;gap:28px}
h1,h2{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.01em}
h2{font-weight:800;font-size:clamp(21px,2.6vw,25px)}
p{margin:0}
header{display:grid;gap:10px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.lead{font-size:16.5px}
.lead b{font-weight:700}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:680px){.choices{grid-template-columns:minmax(0,1fr)}}
.card{--c:var(--blue);--c-soft:var(--blue-soft);
  display:grid;gap:14px;align-content:start;padding:18px 18px 20px;background:var(--surface);
  border:2px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.card.shoot{--c:var(--green);--c-soft:var(--green-soft)}
.card:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,24,40,.08)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.th{aspect-ratio:16/9;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--slip);color:var(--ink);display:block}
.th .ln{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.th .thin{stroke-width:1.4}
.th .acc{stroke:var(--c)}
.th .fill-acc{fill:var(--c);stroke:none}
.chip{justify-self:start;font-size:13.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--c-soft);color:var(--c)}
.desc{color:var(--muted);font-size:15px;line-height:1.55}
.go{justify-self:start;margin-top:2px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;
  padding:10px 16px;border-radius:10px;background:var(--c);color:var(--surface)}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease}
.card:hover .go svg{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){.go svg{transition:none}.card:hover .go svg{transform:none}}

.note{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;line-height:1.55}
.note b{font-weight:700}
.note .em{font-weight:800;color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.note{border:2px solid var(--blue)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">염경중 2학년 2학기 독서 수행평가 · 개인 북 트레일러</p>
    <h1>북 트레일러 제작 안내</h1>
    <p class="lead">기획안에서 고른 <b>제작 방식</b>을 누르세요.</p>
  </header>

  <nav class="choices" aria-label="제작 방식 고르기">
    <a class="card ai" href="ai/">

        <path class="ln acc" d="M8 20V8H20M152 20V8H140M8 70V82H20M152 70V82H140"/>

        <circle class="ln" cx="52" cy="36" r="6"/>
        <path class="ln" d="M38 66L60 46L74 58L84 50L96 64"/>
        <path class="ln acc" d="M120 22V44M109 33H131"/>
        <path class="ln acc" d="M114 27L126 39M126 27L114 39" style="stroke-width:1.2"/>
        <path class="ln acc" d="M112 56V66M107 61H117"/>
      </svg>
      <span class="chip">직접 촬영 + AI 이미지</span>
      <h2>AI 이미지 프롬프트 만들기</h2>
      <p class="desc">장면에 맞는 AI 이미지 프롬프트를 칸을 채워 만듭니다.</p>
      <span class="go">프롬프트 만들러 가기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19M13 6L19 12L13 18"/></svg></span>
    </a>

    <a class="card shoot" href="shoot/">
      <svg class="th" viewBox="0 0 160 90" aria-hidden="true">
        <path class="ln acc" d="M8 20V8H20M152 20V8H140M8 70V82H20M152 70V82H140"/>
        <rect class="ln" x="42" y="26" width="76" height="40" rx="7"/>
        <circle class="ln" cx="102" cy="46" r="10"/>
        <circle class="ln thin" cx="102" cy="46" r="5"/>
        <circle class="fill-acc" cx="56" cy="38" r="4"/>
        <path class="ln thin" d="M52 56H76"/>
      </svg>
      <span class="chip">직접 촬영만</span>
      <h2>직접 촬영 안내</h2>
      <p class="desc">손·사물, 손그림·손글씨를 직접 찍는 방법을 단계별로 안내합니다.</p>
      <span class="go">촬영 안내 보러 가기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19M13 6L19 12L13 18"/></svg></span>
    </a>
  </nav>

  <p class="note"><b>AI 이미지 방식</b>도 <strong class="em">직접 찍은 컷이 3컷 이상</strong> 들어가야 합니다. 찍는 방법은 ‘직접 촬영 안내’를 함께 보세요.</p>
</main>
